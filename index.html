<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jack Van Thyne</title>

  <style>
    body {
      margin: 0;
      padding: 18px 12px 64px 12px;
      background: #dcdcdc;
      font-family: serif;
      font-size: 14px;
    }

    a {
      color: #0000cc;
      text-decoration: underline;
    }

    .visited {
      color: #551a8b !important;
    }

    .wrap {
      display: flex;
      gap: 28px;
      max-width: 1000px;
    }

    .left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .media-box {
      position: relative;
      width: 95px;
    }

    .headshot {
      width: 95px;
      display: block;
    }

    /* BIG VIDEO */
    .headshot-video {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 240px;
      height: 240px;
      object-fit: cover;
      z-index: 10;
    }

    .info-text {
      display: none;
      max-width: 520px;
    }

    .info-text.active {
      display: block;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="left">
    <a href="#" id="openInfo">Jack Van Thyne</a>
    <a href="projects.html" target="_blank">Projects</a>
  </div>

  <div class="media-box">
    <img src="proheadshot.png" class="headshot" id="img" />

    <video id="vid" class="headshot-video" muted loop playsinline preload="auto">
      <source src="headshot.mp4" type="video/mp4">
    </video>
  </div>

  <div class="info-text" id="info">
    “I am a 21-year-old student living in Berkeley, studying landscape architecture at UC Berkeley.
    I am an artist and builder...”
  </div>

</div>

<script>
const btn = document.getElementById("openInfo");
const vid = document.getElementById("vid");
const img = document.getElementById("img");
const info = document.getElementById("info");

let open = false;

btn.onclick = (e) => {
  e.preventDefault();
  open = !open;

  btn.classList.add("visited");

  if (open) {
    info.classList.add("active");

    vid.style.display = "block";

    // IMPORTANT: force load + play
    vid.load();
    vid.currentTime = 0;

    vid.play().catch(err => {
      console.log("play blocked:", err);
    });

  } else {
    info.classList.remove("active");

    vid.pause();
    vid.style.display = "none";
  }
};
</script>

</body>
</html>
