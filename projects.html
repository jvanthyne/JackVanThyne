    body {
      margin: 0;

      font-family: serif;

      line-height: 1.3;
    }

    a,
    button.link-button {
      color: #0000cc;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    a:visited {
      color: #551a8b;
    }

    .visited {
      color: #551a8b !important;
    }

    .page {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      max-width: 1180px;
    }

    .nav {
      width: 300px;
      flex-shrink: 0;
    }

    .nav-title {
      margin-bottom: 8px;
    }

    .section,
    .subsection {
      margin-bottom: 6px;
    }

    .section-title,
    .subsection-title,
    .project-link {
      display: block;
      margin-bottom: 2px;
    }

    .section-children,
    .subsection-children {
      display: none;
      padding-left: 18px;
    }

    .section.open > .section-children,
    .subsection.open > .subsection-children {
      display: block;
    }

    .content {
      flex: 1;
      min-height: 420px;
      max-width: 760px;
    }

    .content-inner {
      display: none;
    }

    .content-inner.active {
      display: block;
    }

    .project-title {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .project-meta {
      margin-bottom: 10px;
    }

    .project-description {
      max-width: 620px;
    }

    .project-link-out {
      margin-top: 8px;
      display: inline-block;
    }

    .video-wrap {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 16 / 9;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .placeholder {
      color: #000;
    }

    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #dcdcdc;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 800px) {
      .page {
        flex-direction: column;
        gap: 18px;
      }

      .nav {
        width: 100%;
      }

      .content {
        max-width: 100%;
        min-height: auto;
      }

      .site-footer {
        position: static;
        margin-top: 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>

    const content = document.getElementById("content");
    const defaultPanel = document.getElementById("defaultPanel");
    const projectLinks = document.querySelectorAll(".project-link");

    function youtubeEmbed(id) {
      return `
        <div class="video-wrap">
          <iframe
            src="https://www.youtube.com/embed/${id}"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      `;
    }

    function renderProject(key) {
      const p = projects[key];
      if (!p) return;

      document.querySelectorAll(".content-inner").forEach(el => el.remove());
      defaultPanel.style.display = "none";

      const panel = document.createElement("div");
      panel.className = "content-inner active";

      let html = `
        <div class="project-title">${p.title}</div>
        <div class="project-meta"># ${p.number}<br />${p.year}</div>
      `;

      if (p.youtube) {
        html += youtubeEmbed(p.youtube);
      } else if (p.note && p.externalLink) {
        html += `
          <div class="project-description">${p.note}</div>
          <a class="project-link-out" href="${p.externalLink}" target="_blank">Open link</a>
        `;
      } else {
        html += `<div class="project-description">${p.description || ""}</div>`;
        if (p.externalLink) {
          html += `<a class="project-link-out" href="${p.externalLink}" target="_blank">Open link</a>`;
        }
      }

      panel.innerHTML = html;
      content.appendChild(panel);
    }

    projectLinks.forEach(link => {
      link.addEventListener("click", function () {
        projectLinks.forEach(item => item.classList.remove("visited"));
        this.classList.add("visited");
        renderProject(this.dataset.project);
      });
    });

    document.querySelectorAll('[data-toggle="section"]').forEach(button => {
      button.addEventListener("click", function () {
        this.parentElement.classList.toggle("open");
        this.classList.add("visited");
      });
    });

    document.querySelectorAll('[data-toggle="subsection"]').forEach(button => {
      button.addEventListener("click", function () {
        this.parentElement.classList.toggle("open");
        this.classList.add("visited");
      });
    });

    function updateClock() {
      document.getElementById("clock").textContent = new Date().toLocaleString();
    }

    updateClock();
    setInterval(updateClock, 1000);
