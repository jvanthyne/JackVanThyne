<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Jack Van Thyne</title>

<style>
body {
  margin: 0;
  padding: 18px 12px 64px 12px;
  background: #dcdcdc;
  font-family: serif;
  font-size: 14px;
  line-height: 1.3;
}

a, button {
  color: #0000cc;
  text-decoration: underline;
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
  text-align: left;
  display: block; /* ensures each project is its own line */
  margin-bottom: 2px;
}

.visited { color: #551a8b !important; }

.page {
  display: flex;
  gap: 36px;
  max-width: 1200px;
}

.nav { width: 320px; }

.section, .subsection { margin-bottom: 8px; }

.section-children { padding-left: 14px; }
.subsection-children { padding-left: 20px; }

.section-children,
.subsection-children {
  display: none;
}

.section.open > .section-children,
.subsection.open > .subsection-children {
  display: block;
}

.content {
  flex: 1;
  max-width: 720px;
}

.project-title { margin-bottom: 6px; }
.project-year { margin-bottom: 10px; }
.project-description { max-width: 620px; }

.video-wrap {
  width: 100%;
  max-width: 700px;
  aspect-ratio: 16/9;
  overflow: hidden;
  margin-top: 10px;
}

.video-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  pointer-events: none;
  transform: scale(1.05);
}

.site-footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 6px 10px;
  font-size: 12px;
  background: #dcdcdc;
  display: flex;
  justify-content: space-between;
}

@media (max-width: 800px){
  .page { flex-direction: column; }
}
</style>
</head>

<body>

<div class="page">

<div class="nav">
<a href="index.html">Back</a>

<div class="section">
<button onclick="toggle(this)">Art</button>
<div class="section-children">

<div class="subsection">
<button onclick="toggle(this)">Paintings</button>
<div class="subsection-children">
<button onclick="loadProject('redwood',this)">Redwood</button>
<button onclick="loadProject('dance',this)">Dance</button>
<button onclick="loadProject('blue',this)">Blue</button>
<button onclick="loadProject('fire',this)">Fire</button>
<button onclick="loadProject('livingwood',this)">Living Wood</button>
</div>
</div>

<div class="subsection">
<button onclick="toggle(this)">Films</button>
<div class="subsection-children">
<button onclick="loadVideo('hWi82rb9htU',this)">Treetops</button>
<button onclick="loadVideo('O1BMu3R6Spc',this)">Cykel</button>
<button onclick="loadVideo('xrAxkaNebeE',this)">Day of the Dead</button>
<button onclick="loadVideo('1jONL0xIJhI',this)">Deckhand</button>
<button onclick="loadVideo('ka_RsPmn0Mk',this)">Chapter 1</button>
<button onclick="loadVideo('vnU5Fm2hM4M',this)">Dig</button>
<button onclick="loadVideo('XlLYzm4eAcQ',this)">Chapter 2</button>
<button onclick="loadVideo('Qbsi1yu2uzw',this)">Chapter 3</button>
<button onclick="loadVideo('HOAjy1_L9gU',this)">Comfort</button>
<button onclick="loadVideo('uoApaNS5F2I',this)">Jargon</button>
</div>
</div>

<div class="subsection">
<button onclick="toggle(this)">Exhibitions</button>
<div class="subsection-children">
<button onclick="loadProject('grotto',this)">Guerrilla Grotto</button>
<button onclick="loadProject('abandoned',this)">Abandoned Spaces</button>
<button onclick="loadProject('time',this)">Time Machine</button>
<button onclick="loadProject('fallen',this)">Fallen to Functional</button>
</div>
</div>

</div>
</div>

</div>

<div class="content" id="content">
Select a project
</div>

</div>

<footer class="site-footer">
<div>contact: <a href="mailto:jjvanthyne@gmail.com">jjvanthyne@gmail.com</a></div>
<div id="clock"></div>
</footer>

<script>
function toggle(el){
  el.parentElement.classList.toggle("open");
  el.classList.add("visited");
}

function loadVideo(id,el){
  document.querySelectorAll("button").forEach(b=>b.classList.remove("visited"));
  el.classList.add("visited");

  document.getElementById("content").innerHTML = `
  <div class="video-wrap">
  <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&fs=0&disablekb=1"></iframe>
  </div>`;
}

function loadProject(key,el){
  document.querySelectorAll("button").forEach(b=>b.classList.remove("visited"));
  el.classList.add("visited");

  const data = {
    redwood:["Redwood","2025","Inspired by a road trip through Northern California. Resting within a redwood grove, this piece reflects on scale, stillness, and presence."],
    dance:["Dance","2023","An abstract study of movement and the human form exploring rhythm, gesture, and expression."],
    blue:["Blue","2025","Inspired by the ocean, a study of subtle movement, depth, and atmosphere."],
    fire:["Fire","2025","A response to wildfire focused on force, destruction, and transformation."],
    livingwood:["Living Wood","2025","Painting paired with a furniture piece exploring growth and form, waste and life, geometry and the natural."],
    grotto:["Guerrilla Grotto","2025","A series of eight guerrilla furniture installations across UC Berkeley built from found materials. Hidden spaces for sitting, gathering, and pause."],
    abandoned:["Abandoned Spaces","2025","Exhibition in a basement space in Denmark exploring occupation and absence."],
    time:["Time Machine","2026","Time and space as lived and recorded examining memory, documentation, and perception."],
    fallen:["Fallen to Functional","2026","Transforms fallen UC Berkeley trees into site-specific furniture remaining grounded in place."]
  };

  const p = data[key];

  document.getElementById("content").innerHTML = `
  <div class="project-title">${p[0]}</div>
  <div class="project-year">${p[1]}</div>
  <div class="project-description">${p[2]}</div>`;
}

function updateClock(){
  document.getElementById("clock").textContent = new Date().toLocaleString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
